<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <style>
    body{
      background-image: url("https://i0.wp.com/blog.nashtechglobal.com/wp-content/uploads/2024/01/pexels-photo-1103970.jpeg?fit=1024%2C682&ssl=1");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      width: 99%;
      height: 100vh;
      text-align: center;
      align-items: center;
      justify-content: center;
    }

    /* navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(255, 255, 255, 0.19);
      width: 98%;
      padding: 10px 20px;
      color: rgb(0, 0, 0);
      text-align: center;
      align-items: center;
      align-self: center;
    }


    .navbar a {
      color: rgb(0, 0, 0);
      padding: 14px 20px;
      text-decoration: none;
    }

    .navbar a:hover {
      border-radius: 4px;
      font-weight: 700;
    }

    .navbar .menu {
      display: flex;
      gap: 10px;
    }


    .navbar .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .navbar .user-info img {
      width: 30px;
      height: 30px;
      border-radius: 50%;
    }


    /* Filters and Search */
    .filters {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }

    .filters select, .filters input[type="text"] {
      padding: 5px;
      font-size: 14px;
    }

    .filters select {
      margin-right: 10px;
    }

    /* Table */
    table {
      width: 80%;
      margin: 0 auto;
      border-collapse: collapse;
      background-color: rgba(255, 255, 255, 0.9);
    }

    table, th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
    }

    .actions {
      display: flex;
      gap: 5px;
    }

    .actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    .actions button:hover {
      color: #007bff;
    }

    #createAccount{
      justify-content: end;
      text-align: end;
      background-color: #06a729;
      padding: 5px;
      border: black solid 1px;
      text-decoration: none;
      color: Black;
    }
  </style>
</head>
<body>
<div id="all" class="row">
  <div class="navbar">


    <div class="menu">
      <a href="/home">Home</a>
    </div>

    <div class="user-info">
      <span th:text="${#strings.toUpperCase(username)}">name</span>
      <span th:text="${#strings.toUpperCase(role)}">role</span>
      <a href="/profile"> <!-- Đường dẫn đến trang profile -->
        <img src="https://lifehacker.com/imagery/articles/01HF2GKNRQZ4MN1YA639Q53NQV/hero-image.fill.size_1200x675.png"
             alt="User Avatar"
             >
      </a>
    </div>
  </div>

  <!-- Filters and search -->
  <div class="filters">
    <form method="GET" action="/users"> <!-- Chuyển hướng dữ liệu qua GET request -->
      <div>
        <label for="position">Position: </label>
        <select id="position" name="position"> <!-- Thêm thuộc tính name để gửi dữ liệu -->
          <option value="">All</option>
          <option value="admin">admin</option>
          <option value="manager">manager</option>
          <option value="developer">developer</option>
          <option value="hr">hr</option>
          <option value="designer">designer</option>
        </select>

        <label for="status">Status: </label>
        <select id="status" name="status">
          <option value="">All</option>
          <option value="true">Active</option>
          <option value="false">Inactive</option>
        </select>

        <label for="display">Display: </label>
        <select id="display" name="display">
          <option value="5">5 lines</option>
          <option value="10">10 lines</option>
          <option value="15">15 lines</option>
        </select>
          <input type="text" id="search" name="search" placeholder="Search" />
          <button type="submit">🔍</button>

          <a id="createAccount" href="/admin/getForm"> + Create new account</a>

      </div>
    </form>
  </div>
  <table>
    <thead>
    <tr>
      <th>STT</th>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Username</th>
      <th>Status</th>
      <th>Role</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody id="userTableBody">
    <!-- Dùng Thymeleaf để lặp qua danh sách người dùng -->
    <th:block th:each="user, iterStat : ${users}">
      <tr>
        <td th:text="${iterStat.index + 1}"></td> <!-- STT -->
        <td th:text="${user.name}"></td> <!-- Name -->
        <td th:text="${user.email}"></td> <!-- Email -->
        <td th:text="${user.phone}"></td> <!-- Phone -->
        <td th:text="${user.username}"></td> <!-- Current position (username) -->
        <td th:text="${user.status ? 'Active' : 'Inactive'}"></td> <!-- Status -->
        <td th:text="${user.role}"></td>
        <td class="actions">
          <a class="button" title="View" th:href="@{/admin/getUpdateForm/{id}(id=${user.id})}">👁️</a>

          <!-- Kích hoạt -->
          <button
                  th:if="${!user.status}"
                  th:attr="data-id=${user.id}"
                  th:onclick="'activateUser(' + ${user.id} + ')'">
            ✅
          </button>
          <!-- Khóa -->
          <button
                  th:if="${user.status}"
                  th:attr="data-id=${user.id}"
                  th:onclick="'deactivateUser(' + ${user.id} + ')'">
            ❌
          </button>
        </td>
      </tr>
    </th:block>
    </tbody>
  </table>
</div>
<script>
  function activateUser(userId) {
    fetch(`/users/${userId}/activate`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ id: userId }),
    })
            .then(response => {
              if (response.ok) {
                location.reload(); // Reload lại giao diện
              }
            })
            .catch(error => console.error('Error:', error));
  }

  function deactivateUser(userId) {
    fetch(`/users/${userId}/deactivate`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ id: userId }),
    })
            .then(response => {
              if (response.ok) {
                location.reload(); // Reload lại giao diện
              }
            })
            .catch(error => console.error('Error:', error));
  }

</script>
</body>
</html>
