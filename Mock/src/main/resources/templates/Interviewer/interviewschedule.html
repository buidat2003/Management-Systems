<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Schedule Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Ubuntu', sans-serif;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            background: #4070f4;
            color: #fff;
            z-index: 10;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }
        nav .logo a {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }
        nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }
        .container {
            margin-top: 100px;
        }
        .table th, .table td {
            text-align: center;
            vertical-align: middle;
        }
        .table .btn {
            margin: 2px;
        }
        #uploadForm {
            display: none;
        }
    </style>
</head>
<body>
<!-- Navbar -->
<nav>
    <div class="d-flex justify-content-between align-items-center">
        <div class="logo">
            <a href="#">Interview Schedule Management</a>
        </div>
        <ul class="d-flex">
            <li><a href="/home">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>
</nav>

<div class="container">
    <!-- Download and Upload Buttons -->
    <div class="d-flex justify-content-end mb-3">
        <a id="downloadExcelBtn" href="/interviewschedules/exportExcel" class="btn btn-primary">
            <i class="bi bi-file-earmark-spreadsheet"></i> Download Excel
        </a>
        <button id="uploadExcelBtn" class="btn btn-secondary ms-2" onclick="showUploadForm()">
            <i class="bi bi-upload"></i> Upload Excel
        </button>
    </div>

    <!-- Upload Form -->
    <div id="uploadForm" class="mb-3">
        <input type="file" id="excelFile" accept=".xls,.xlsx" class="form-control" onchange="validateExcelFile(event)">
        <button type="button" class="btn btn-primary mt-2" onclick="submitExcel()">Upload</button>
    </div>

    <!-- Table -->
    <table class="table table-bordered">
        <thead class="table-light">
        <tr>
            <th>Schedule ID</th>
            <th>Candidate</th>
            <th>Schedule Date</th>
            <th>Schedule Time</th>
            <th>Interviewer</th>
            <th>Google Meet Link</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="scheduleTableBody">
        <tr th:each="schedule : ${schedules}">
            <td th:text="${schedule.id}">1</td>
            <td th:text="${schedule.candidate.name}">Nguyen Van A</td>
            <td th:text="${schedule.scheduleDate}">2024-12-01</td>
            <td th:text="${schedule.scheduleTime}">09:00 AM</td>
            <td th:text="${schedule.interviewer.name}">IT Department</td>
            <td>
                <a th:href="${schedule.googleMeetLink}" target="_blank">Link</a>
            </td>
            <td>
                <button type="button" class="btn btn-success btn-sm" onclick="markAsInterviewed(this)" th:data-schedule-id="${schedule.id}">
                    Mark as Interviewed
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    function showUploadForm() {
        const uploadForm = document.getElementById("uploadForm");
        uploadForm.style.display = "block";
    }

    // Xác minh file Excel
    function validateExcelFile(event) {
        const file = event.target.files[0];
        if (!file || !file.name.endsWith(".xls") && !file.name.endsWith(".xlsx")) {
            alert("Please select a valid Excel file.");
            event.target.value = ""; // Reset file input
        }
    }

    // Upload Excel và cập nhật trạng thái
    async function submitExcel() {
        const fileInput = document.getElementById('excelFile');
        const file = fileInput.files[0];

        if (!file) {
            alert("Please select a file to upload.");
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        try {
            const response = await fetch("/interviewschedules/uploadExcel", {
                method: "POST",
                body: formData
            });

            if (response.ok) {
                alert("File uploaded and data updated successfully.");

                // Ẩn form "Chọn tệp" và nút "Upload"
                const uploadForm = document.getElementById("uploadForm");
                uploadForm.style.display = "none";

                // Reload lại trang
                setTimeout(() => {
                    location.reload();
                }, 500); // Delay 0.5 giây trước khi F5
            } else {
                alert("Failed to upload file.");
            }
        } catch (error) {
            console.error("Error uploading file:", error);
            alert("An error occurred while uploading.");
        }
    }

    async function markAsInterviewed(button) {
        const scheduleId = button.getAttribute("data-schedule-id");
        try {
            const response = await fetch(`/interviewschedules/markAsInterviewed?scheduleId=${scheduleId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            });

            if (response.ok) {
                alert("Interview status updated successfully!");
                // Sau khi đánh dấu là đã phỏng vấn, thay đổi nút "Download Excel" thành "Upload Excel"
                document.getElementById("downloadExcelBtn").style.display = "none";
                document.getElementById("uploadExcelBtn").style.display = "inline-block";
            } else {
                alert("Failed to update status.");
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }
</script>
</body>
</html>
