<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Management</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
          integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOMtr2s8G5FZ09YQqLl4Zt/3PB/lQpZHVj1eUzj+" crossorigin="anonymous"/>
    <style>
        body {
            background-image: url("https://i0.wp.com/blog.nashtechglobal.com/wp-content/uploads/2024/01/pexels-photo-1103970.jpeg?fit=1024%2C682&ssl=1");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #333;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.4);
            padding: 10px 30px;
            width: 90%;
            max-width: 1200px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.2);
        }

        .navbar a {
            color: #444;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .navbar a:hover {
            color: #0056b3;
        }

        .menu {
            display: flex;
            gap: 15px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #444;
        }

        .user-info img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        .offer-form {
            width: 90%;
            max-width: 1000px;
            margin: 20px auto;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 12px;
            box-shadow: 0px 6px 20px rgba(0, 0, 0, 0.2);
            color: #333;
        }

        .offer-form h2 {
            text-align: center;
            font-size: 26px;
            color: #333;
            margin-bottom: 30px;
        }

        .form-row {
            display: flex;
            gap: 40px; /* Increased gap between columns */
            margin-bottom: 20px;
        }

        .form-column {
            flex: 1;
        }

        .form-row label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }

        .form-row input[type="text"],
        .form-row input[type="date"],
        .form-row input[type="number"],
        .form-row textarea {
            width: 98%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
            transition: all 0.3s;
        }

        .form-row input[type="text"]:focus,
        .form-row input[type="date"]:focus,
        .form-row input[type="number"]:focus,
        .form-row textarea:focus {
            border-color: #007bff;
            background-color: #fff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }

        .form-row textarea {
            resize: vertical;
            min-height: 100px;
        }

        .offer-form button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
        }

        .offer-form button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        .back{
            text-decoration: none;
            color: #0a0e27;
        }

        .message {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="menu">
        <a href="#Recruiter">Recruiter</a>
        <a href="#Manager">Manager</a>
        <a href="#Interviewer">Interviewer</a>
    </div>
    <div class="user-info">
        <span th:text="${session.USER_NAME}"></span>
        <span th:text="${session.USER_ROLE}"></span>
        <img th:src="${session.USER_AVATAR}"
             alt="User Avatar">
    </div>
</div>

<div class="offer-form">
    <h2>Offer details for manager</h2>
    <div id="message">
        <!-- Hiển thị thông báo thành công nếu có -->
        <div class="message success" th:if="${message}">
            <p th:text="${message}"></p>
        </div>

        <!-- Hiển thị thông báo lỗi nếu có -->
        <div class="message error" th:if="${errorMessage}">
            <p th:text="${errorMessage}"></p>
        </div>
    </div>

    <!-- Form tạo offer mới -->
    <form action="/offers/create" method="post">
        <div class="form-row">
            <div class="form-column">
                <label for="offerDate">Offer Date:</label>
                <!-- Set giá trị offerDate mặc định là ngày hiện tại -->
                <input type="date" id="offerDate" name="offerDate" th:value="${offer.offerDate}" readonly>
            </div>
            <div class="form-column">
                <label for="startDate">Start Date:</label>
                <input type="date" id="startDate" name="startDate" th:value="${offer.startDate}" required>
            </div>
            <div class="form-column">
                <label for="salary">Salary:</label>
                <input type="text" id="salary" name="salary" th:value="${offer.salary}" maxlength="50" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-column">
                <label for="candidateId">Candidate ID:</label>
                <input type="text" id="candidateId" name="candidateId" th:value="${offer.candidate.id}" required>
            </div>

            <div class="form-column">
                <label for="candidateName">Candidate Name:</label>
                <input type="text" id="candidateName" name="candidateName" th:value="${offer.candidate.name}" maxlength="50" required>
            </div>

            <div class="form-column">
                <label for="candidateEmail">Candidate Email:</label>
                <input type="text" id="candidateEmail" name="candidateEmail" th:value="${offer.candidate.email}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-column">
                <label for="expectedSalary">Expected Salary:</label>
                <input type="text" id="expectedSalary" name="expectedSalary" th:value="${offer.candidate.expectedSalary}" required>
            </div>

            <div class="form-column">
                <label for="candidateExp">Candidate Experience (years):</label>
                <input type="text" id="candidateExp" name="candidateExp" th:value="${offer.candidate.exp}" maxlength="50" required>
            </div>

            <div class="form-column">
                <label for="candidateMainTech">Candidate Main Tech:</label>
                <input type="text" id="candidateMainTech" name="candidateMainTech" th:value="${offer.candidate.mainTech}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-column">
                <label for="candidateVacancy">Candidate Education:</label>
                <input type="text" id="candidateVacancy" name="candidateVacancy" th:value="${offer.candidate.education}" maxlength="50" required>
            </div>

            <div class="form-column">
                <label for="candidatePhone">Candidate Phone Number:</label>
                <input type="text" id="candidatePhone" name="candidatePhone" th:value="${offer.candidate.phone}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-column">
                <label for="createdUserId">Created By (User ID):</label>
                <input type="text" id="createdUserId" name="createdUserId" th:value="${offer.createdUser.id}"
                       required>
            </div>

        </div>
    </form>
    <div class="form-row">
        <div class="form-column">
            <form th:if="${offer.status != ApproveStatus.APPROVED && offer.status != ApproveStatus.REJECTED}"
                  th:action="@{/ApproveReject/approveOffer/{id}(id=${offer.id})}" method="post"
                  style="display:inline;">
                <button type="submit" class="btn btn-success"><i class="fa-solid fa-check" style="color: #06a729">Approve</i>
                </button>
            </form>
        </div>
        <div class="form-column">
<!--            <form th:if="${offer.status != ApproveStatus.APPROVED && offer.status != ApproveStatus.REJECTED}"-->
<!--                  th:action="@{/ApproveReject/rejectOffer/{id}(id=${offer.id})}" method="post"-->
<!--                  style="display:inline;">-->
<!--                <button type="submit" class="btn btn-danger"><i class="fa-solid fa-xmark" style="color: #f44336">Reject</i>-->
<!--                </button>-->
<!--            </form>-->
            <form th:if="${offer.status != ApproveStatus.APPROVED && offer.status != ApproveStatus.REJECTED}"
                  th:action="@{/ApproveReject/goReason/{id}(id=${offer.id})}" method="get"
                  style="display:inline;">
                <button type="submit" class="btn btn-danger"><i class="fa-solid fa-xmark"
                                                                style="color: #f44336">Reject</i></button>

            </form>
        </div>
    </div>
    <div class="form-row">
<!--        th:if="${offer.status == ApproveStatus.APPROVED || offer.status == ApproveStatus.REJECTED}"-->
        <button >
            <a class="back" title="View" href="/ApproveReject/offers">Back to offer list</a>
        </button>
    </div>
</div>

<!-- Modal Xác Nhận Approve -->
<div class="modal fade" id="confirmModal" tabindex="-1" role="dialog" aria-labelledby="confirmModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmModalLabel">Are you sure to approve this offer?</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--            <div class="modal-body">-->
            <!--                Are you sure to approve this offer?-->
            <!--                <p><strong>Offer Date:</strong> <span th:text="${offer.offerDate}"></span></p>-->
            <!--                <p><strong>Start Date:</strong> <span th:text="${offer.startDate}"></span></p>-->
            <!--                <p><strong>Salary:</strong> <span th:text="${offer.salary}"></span></p>-->
            <!--                <p><strong>Candidate:</strong> <span th:text="${offer.candidate.name}"></span></p>-->
            <!--                <p><strong>Status:</strong> <span th:text="${offer.status}"></span></p>-->
            <!--                <p><strong>Created By:</strong> <span th:text="${offer.createdUser.name}"></span></p>-->
            <!--            </div>-->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                <button type="button" id="confirmBtn" class="btn btn-primary">Yes</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Xác Nhận Reject -->
<div class="modal fade" id="rejectModal" tabindex="-1" role="dialog" aria-labelledby="rejectModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="rejectModalLabel">Are you sure to reject this offer?</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <!--            <div class="modal-body">-->
            <!--                <label for="rejectReasonInput">Reason for rejection:</label>-->
            <!--                <input type="text" id="rejectReasonInput" class="form-control" placeholder="Enter reason here">-->
            <!--            </div>-->
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                <button type="button" id="rejectConfirmBtn" class="btn btn-danger">Yes</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        let approveForm = null;
        let rejectForm = null;

        // Sự kiện cho nút Approve
        document.querySelectorAll(".btn-success").forEach(button => {
            button.addEventListener("click", function (e) {
                e.preventDefault();
                approveForm = this.closest("form");
                $('#confirmModal').modal('show');
            });
        });

        // Xử lý khi nhấn Yes trên modal Approve
        document.getElementById("confirmBtn").addEventListener("click", function () {
            if (approveForm) {
                approveForm.submit();
            }
            $('#confirmModal').modal('hide');
        });

        // Sự kiện cho nút Reject
        // document.querySelectorAll(".btn-danger").forEach(button => {
        //     button.addEventListener("click", function (e) {
        //         e.preventDefault();
        //         rejectForm = this.closest("form");
        //         $('#rejectModal').modal('show');
        //     });
        // });

        // Xử lý khi nhấn Yes trên modal Reject
        // document.getElementById("rejectConfirmBtn").addEventListener("click", function () {
        //     if (rejectForm) {
        //         // Gắn lý do từ input vào hidden field
        //         const reasonInput = document.getElementById("rejectReasonInput").value;
        //         const hiddenInput = rejectForm.querySelector("input[name='reason']");
        //         if (hiddenInput) {
        //             hiddenInput.value = reasonInput;
        //         }
        //         rejectForm.submit();
        //     }
        //     $('#rejectModal').modal('hide');
        // });
    });
</script>


<script>
    // Set the current date as the default offerDate if not provided
    document.getElementById('offerDate').value = new Date().toISOString().split('T')[0];
</script>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
