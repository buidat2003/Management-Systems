<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Management</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
          integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
          integrity="sha384-k6RqeWeci5ZR/Lv4MR0sA0FfDOMtr2s8G5FZ09YQqLl4Zt/3PB/lQpZHVj1eUzj+" crossorigin="anonymous"/>

    <style>
        body {
            background-image: url("https://i0.wp.com/blog.nashtechglobal.com/wp-content/uploads/2024/01/pexels-photo-1103970.jpeg?fit=1024%2C682&ssl=1");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            width: 99%;
            height: 100vh;
            text-align: center;
            align-items: center;
            justify-content: center;
        }

        /* navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.19);
            width: 98%;
            padding: 10px 20px;
            color: rgb(0, 0, 0);
            text-align: center;
            align-items: center;
            align-self: center;
        }

        .navbar a {
            color: rgb(0, 0, 0);
            padding: 14px 20px;
            text-decoration: none;
        }

        .navbar a:hover {
            border-radius: 4px;
            font-weight: 700;
        }

        .navbar .menu {
            display: flex;
            gap: 10px;
        }

        .navbar .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .navbar .user-info img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }

        /* Filters and Search */
        .filters {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .filters select, .filters input[type="text"] {
            padding: 5px;
            font-size: 14px;
        }

        .filters select {
            margin-right: 10px;
        }

        /* Table */
        table {
            width: 80%;
            margin: 0 auto;
            border-collapse: collapse;
            background-color: rgba(255, 255, 255, 0.9);
        }

        table, th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .actions {
            display: flex;
            gap: 5px;
        }

        .actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        .actions button:hover {
            color: #007bff;
        }

        /*pagination*/
        .pagination {
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin-top: 20px;
        }

        .pagination .page-item {
            margin: 0 5px;
        }


        .pagination .page-item.active .page-link {
            background-color: #007bff;
            border-color: #007bff;
            color: white;
        }

        .pagination .page-link {
            color: #007bff;
            text-decoration: none;
        }

        .pagination .page-link:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>
<div id="all" class="row">
    <div class="navbar">
        <div class="user-info">
            <span th:text="${session.USER_NAME}"></span>
            <span th:text="${session.USER_ROLE}"></span>
            <img th:src="${session.USER_AVATAR}"
                 alt="User Avatar">
        </div>
    </div>

    <div id="message">
        <!-- Success message -->
        <div class="message success" th:if="${message}">
            <p th:text="${message}"></p>
        </div>

        <!-- Error message -->
        <div class="message error" th:if="${errorMessage}">
            <p th:text="${errorMessage}"></p>
        </div>
    </div>
    <!-- Filters and search -->
    <div class="filters">
        <form method="GET" action="/ApproveReject/offers"> <!-- Chuyển hướng dữ liệu qua GET request -->
            <div>


                <label for="display">Display: </label>
                <select id="display" name="size" onchange="updatePageSize()">
                    <option value="1" th:selected="${pageSize == 1}">1 lines</option>
                    <option value="5" th:selected="${pageSize == 5}">5 lines</option>
                    <option value="10" th:selected="${pageSize == 10}">10 lines</option>
                    <option value="15" th:selected="${pageSize == 15}">15 lines</option>
                </select>

                <label for="statusFilter">Status: </label>
                <select id="statusFilter" name="status" onchange="updateStatusFilter()">
                    <option th:value="" th:selected="${status == null || status == ''}">All</option>
                    <option th:value="${ApproveStatus.PENDING}" th:selected="${status == ApproveStatus.PENDING}">Pending</option>
                    <option th:value="${ApproveStatus.APPROVED}" th:selected="${status == ApproveStatus.APPROVED}">Approved</option>
                    <option th:value="${ApproveStatus.REJECTED}" th:selected="${status == ApproveStatus.REJECTED}">Rejected</option>
                </select>


                <input type="text" id="search" name="search" placeholder="Search">
                <button type="submit">🔍</button>
            </div>
        </form>

    </div>

    <!-- Table for displaying offers -->
    <table>
        <thead>
        <tr>
            <th>STT</th>
            <th>Offer Date</th>
            <th>Start Date</th>
            <th>Salary</th>
            <th>Candidate</th>
            <th>Status</th>
            <th>Created By</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <!-- Dùng Thymeleaf để lặp qua danh sách offer -->
        <th:block th:each="offer, iterStat : ${offers}">
            <tr>
                <td th:text="${iterStat.index + 1}"></td> <!-- STT -->
                <td th:text="${offer.offerDate}"></td> <!-- Offer Date -->
                <td th:text="${offer.startDate}"></td> <!-- Start Date -->
                <td th:text="${offer.salary}"></td> <!-- Salary -->
                <td th:text="${offer.candidate.name}"></td> <!-- Candidate -->
                <td th:text="${offer.status}"></td> <!-- Status -->
                <td th:text="${offer.createdUser.name}"></td> <!-- Created By -->
                <td class="actions">
                    <button><a class="button" title="View" th:href="@{/ApproveReject/viewOffer/{id}(id=${offer.id})}">👁️</a>
                    </button>
                    <form th:if="${offer.status != ApproveStatus.APPROVED && offer.status != ApproveStatus.REJECTED}"
                          th:action="@{/ApproveReject/approveOffer/{id}(id=${offer.id})}" method="post"
                          style="display:inline;">
                        <button type="submit" class="btn btn-success"><i class="fa-solid fa-check"
                                                                         style="color: #06a729"></i></button>
                    </form>

                    <form th:if="${offer.status != ApproveStatus.APPROVED && offer.status != ApproveStatus.REJECTED}"
                          th:action="@{/ApproveReject/goReason/{id}(id=${offer.id})}" method="get"
                          style="display:inline;">
                        <button type="submit" class="btn btn-danger"><i class="fa-solid fa-xmark"
                                                                        style="color: #f44336"></i></button>
<!--                        <input type="hidden" name="reason" id="rejectReason-${offer.id}">-->
                    </form>
                </td>
            </tr>
        </th:block>
        </tbody>
    </table>
</div>

<div class="pagination">
    <nav aria-label="Page navigation">
        <ul class="pagination">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/ApproveReject/offers(page=${currentPage - 1}, size=${pageSize})}"
                   aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>
            <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                <li class="page-item" th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/ApproveReject/offers(page=${i}, size=${pageSize})}"
                       th:text="${i + 1}">1</a>
                </li>
            </th:block>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/ApproveReject/offers(page=${currentPage + 1}, size=${pageSize})}"
                   aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
</div>

<!-- Modal Xác Nhận Approve -->
<div class="modal fade" id="confirmModal" tabindex="-1" role="dialog" aria-labelledby="confirmModalLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmModalLabel">Are you sure to approve this offer?</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                <button type="button" id="confirmBtn" class="btn btn-primary">Yes</button>
            </div>
        </div>
    </div>
</div>

<!-- Modal Xác Nhận Reject -->
<div class="modal fade" id="rejectModal" tabindex="-1" role="dialog" aria-labelledby="rejectModalLabel"
     aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="rejectModalLabel">Are you sure to reject this offer?</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">No</button>
                <button type="button" id="rejectConfirmBtn" class="btn btn-danger">Yes</button>
            </div>
        </div>
    </div>
</div>

<script>
    function updatePageSize() {
        const selectedSize = document.getElementById('display').value; // Lấy giá trị đã chọn
        const currentUrl = new URL(window.location.href); // Lấy URL hiện tại
        currentUrl.searchParams.set('size', selectedSize); // Cập nhật tham số 'size'
        currentUrl.searchParams.set('page', 0); // Reset về trang đầu tiên
        window.location.href = currentUrl.toString(); // Chuyển hướng đến URL mới
    }
</script>

<script>
    function updateStatusFilter() {
        const selectedStatus = document.getElementById('statusFilter').value; // Lấy giá trị đã chọn
        const currentUrl = new URL(window.location.href); // Lấy URL hiện tại
        currentUrl.searchParams.set('status', selectedStatus); // Cập nhật tham số 'status'
        currentUrl.searchParams.set('page', 0); // Reset về trang đầu tiên
        window.location.href = currentUrl.toString(); // Chuyển hướng đến URL mới
    }
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        let approveForm = null;
        let rejectForm = null;

        // Sự kiện cho nút Approve
        document.querySelectorAll(".btn-success").forEach(button => {
            button.addEventListener("click", function (e) {
                e.preventDefault();
                approveForm = this.closest("form");
                $('#confirmModal').modal('show');
            });
        });

        // Xử lý khi nhấn Yes trên modal Approve
        document.getElementById("confirmBtn").addEventListener("click", function () {
            if (approveForm) {
                approveForm.submit();
            }
            $('#confirmModal').modal('hide');
        });

    });
</script>


<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
