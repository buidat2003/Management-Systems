<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Offer Approval Notification</title>
</head>
<body>
<h1>Congratulations!</h1>
<p>Your offer with the following details has been approved:</p>
<ul>
    <li><strong>Offer Date:</strong> <span th:text="${offerDate}"></span></li>
    <li><strong>Start Date:</strong> <span th:text="${startDate}"></span></li>
    <li><strong>Salary:</strong> <span th:text="${salary}"></span></li>
    <li><strong>Candidate Name:</strong> <span th:text="${candidateName}"></span></li>
    <li><strong>Created By:</strong> <span th:text="${createdBy}"></span></li>
</ul>
<p>Thank you for choosing our service!</p>
</body>
</html>
